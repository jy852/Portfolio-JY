spring:
  output:
    ansi:
      enabled: always
  datasource:
    hikari:
      auto-commit: false
  jpa:
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
        use_sql_comments: true
    hibernate:
      ddl-auto: validate
    show-sql: true

jwt:
  secret-key: ${jwt_secret_key}
  access-expiration-ms: "#{1000L * 60 * 5}"
  refresh-expiration-ms: "#{1000L * 60 * 60 * 24 * 7}"